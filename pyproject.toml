[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-mcp-server"
version = "1.1.1"
description = "A server for complex mathematical calculations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Ceiling, not decoration: this server imports the SDK BY MODULE PATH
    # (`mcp.server.fastmcp.FastMCP`), and 2.0.0 — published with the 2026-07-28 spec —
    # removed that module and renamed FastMCP to MCPServer. With an open range every
    # `uvx` run re-resolves, so the release alone broke installs that had not changed a
    # line. Lift the cap only together with the v2 migration in calculator_server.py.
    "mcp[cli]>=1.27.0,<2",
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    "sympy>=1.13.0",
    "matplotlib>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.14.0",
]

[project.scripts]
calculator-mcp-server = "calculator_server:main"

[tool.setuptools]
py-modules = ["calculator_server"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
